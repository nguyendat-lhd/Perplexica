services:
  searxng:
    image: docker.io/searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:rw
    ports:
      - 4000:8080
    networks:
      - perplexica-network
    restart: unless-stopped

  app:
    image: itzcrazykns1337/perplexica:main
    build:
      context: .
      dockerfile: app.dockerfile
    environment:
      - SEARXNG_API_URL=http://searxng:8080
      - DATA_DIR=/home/perplexica
    ports:
      - 3000:3000
    networks:
      - perplexica-network
    volumes:
      - /mnt/efs/data:/home/perplexica/data
      - /mnt/efs/uploads:/home/perplexica/uploads
      - ./config.toml:/home/perplexica/config.toml
    restart: unless-stopped
    depends_on:
      - searxng

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    ports:
      - 3001:3001
    networks:
      - perplexica-network
    environment:
      - PORT=3001
      - PERPLEXICA_BASE_URL=http://app:3000
    restart: unless-stopped
    depends_on:
      - app

networks:
  perplexica-network:
    driver: bridge

