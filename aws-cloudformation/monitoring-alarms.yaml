AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudWatch Alarms and Auto Scaling for Perplexica Stack'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging, development]
    Description: Environment name
  
  ClusterName:
    Type: String
    Description: ECS Cluster Name
    Default: ''
  
  PerplexicaServiceName:
    Type: String
    Description: Perplexica Web Service Name
    Default: ''
  
  MCPServerServiceName:
    Type: String
    Description: MCP Server Service Name
    Default: ''
  
  SearXNGServiceName:
    Type: String
    Description: SearXNG Service Name
    Default: ''
  
  ALBFullName:
    Type: String
    Description: Application Load Balancer Full Name
    Default: ''
  
  AlertEmail:
    Type: String
    Description: Email address for CloudWatch alarms
    Default: ''

Resources:
  # SNS Topic for Alerts
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${Environment}-perplexica-alerts'
      DisplayName: Perplexica Alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # CloudWatch Alarms for Perplexica Web Service

  # CPU Utilization Alarm
  PerplexicaCPUAlarmHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-perplexica-web-cpu-high'
      AlarmDescription: 'Perplexica Web CPU utilization is above 80%'
      MetricName: CPUUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Ref PerplexicaServiceName
        - Name: ClusterName
          Value: !Ref ClusterName
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  PerplexicaCPUAlarmCritical:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-perplexica-web-cpu-critical'
      AlarmDescription: 'Perplexica Web CPU utilization is above 90%'
      MetricName: CPUUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Ref PerplexicaServiceName
        - Name: ClusterName
          Value: !Ref ClusterName
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Memory Utilization Alarm
  PerplexicaMemoryAlarmHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-perplexica-web-memory-high'
      AlarmDescription: 'Perplexica Web Memory utilization is above 80%'
      MetricName: MemoryUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Ref PerplexicaServiceName
        - Name: ClusterName
          Value: !Ref ClusterName
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  PerplexicaMemoryAlarmCritical:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-perplexica-web-memory-critical'
      AlarmDescription: 'Perplexica Web Memory utilization is above 90%'
      MetricName: MemoryUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Ref PerplexicaServiceName
        - Name: ClusterName
          Value: !Ref ClusterName
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # MCP Server Alarms
  MCPServerCPUAlarmHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-mcp-server-cpu-high'
      AlarmDescription: 'MCP Server CPU utilization is above 80%'
      MetricName: CPUUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Ref MCPServerServiceName
        - Name: ClusterName
          Value: !Ref ClusterName
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  MCPServerMemoryAlarmHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-mcp-server-memory-high'
      AlarmDescription: 'MCP Server Memory utilization is above 80%'
      MetricName: MemoryUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Ref MCPServerServiceName
        - Name: ClusterName
          Value: !Ref ClusterName
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # SearXNG Alarms
  SearXNGCPUAlarmHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-searxng-cpu-high'
      AlarmDescription: 'SearXNG CPU utilization is above 80%'
      MetricName: CPUUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Ref SearXNGServiceName
        - Name: ClusterName
          Value: !Ref ClusterName
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  SearXNGMemoryAlarmHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-searxng-memory-high'
      AlarmDescription: 'SearXNG Memory utilization is above 80%'
      MetricName: MemoryUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Ref SearXNGServiceName
        - Name: ClusterName
          Value: !Ref ClusterName
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # ALB Target Response Time Alarm
  ALBResponseTimeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-alb-response-time-high'
      AlarmDescription: 'ALB average response time is above 5 seconds'
      MetricName: TargetResponseTime
      Namespace: AWS/ApplicationELB
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref ALBFullName
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # ALB HTTP 5xx Errors Alarm
  ALB5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-alb-5xx-errors'
      AlarmDescription: 'ALB HTTP 5xx errors are above threshold'
      MetricName: HTTPCode_Target_5XX_Count
      Namespace: AWS/ApplicationELB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref ALBFullName
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # ALB Unhealthy Hosts Alarm
  ALBUnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-alb-unhealthy-hosts'
      AlarmDescription: 'ALB has unhealthy target hosts'
      MetricName: UnHealthyHostCount
      Namespace: AWS/ApplicationELB
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref ALBFullName
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Auto Scaling - Perplexica Web Service
  PerplexicaScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 10
      MinCapacity: 1
      ResourceId: !Sub 'service/${ClusterName}/${PerplexicaServiceName}'
      RoleARN: !GetAtt AutoScalingRole.Arn
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  PerplexicaCPUScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${Environment}-perplexica-web-cpu-scaling'
      PolicyType: TargetTrackingScaling
      ScalableTarget: !Ref PerplexicaScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  PerplexicaMemoryScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${Environment}-perplexica-web-memory-scaling'
      PolicyType: TargetTrackingScaling
      ScalableTarget: !Ref PerplexicaScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: 80.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # Auto Scaling Role
  AutoScalingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-perplexica-autoscaling-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: application-autoscaling.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceAutoscaleRole

Outputs:
  AlertTopicArn:
    Description: SNS Topic ARN for alerts
    Value: !Ref AlertTopic
    Export:
      Name: !Sub '${Environment}-perplexica-alert-topic-arn'

