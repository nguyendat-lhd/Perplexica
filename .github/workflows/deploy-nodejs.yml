name: Deploy to EC2 Staging

on:
  push:
    branches: [ develop-deployment ]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  STACK_NAME: trangvang-perplexica-staging
  KEY_NAME: trangvang-perplexica-key
  NODE_VERSION: '18'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint || echo "⚠️  Linting completed with warnings"
        continue-on-error: true

      - name: Run type checking
        run: npx tsc --noEmit || echo "⚠️  Type checking completed with warnings"
        continue-on-error: true

      - name: Run database migration
        run: npm run db:migrate

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if EC2 instance exists
        id: check-stack
        run: |
          if aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Stack exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ Stack does not exist, will create"
          fi

      - name: Create EC2 infrastructure (if needed)
        if: steps.check-stack.outputs.exists == 'false'
        run: |
          echo "🚀 Creating CloudFormation stack..."
          aws cloudformation create-stack \
            --stack-name ${{ env.STACK_NAME }} \
            --template-body file://cloudformation-templates/perplexica-ec2-stack.yaml \
            --parameters \
              ParameterKey=KeyName,ParameterValue=${{ env.KEY_NAME }} \
              ParameterKey=InstanceType,ParameterValue=t3.small \
              ParameterKey=VolumeSize,ParameterValue=20 \
              ParameterKey=SSHLocation,ParameterValue=0.0.0.0/0 \
              ParameterKey=AllocateElasticIP,ParameterValue=true \
              ParameterKey=DomainName,ParameterValue=staging-perplexica.trangvang.ai \
              ParameterKey=EmailAddress,ParameterValue=admin@trangvang.ai \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM
          
          echo "⏳ Waiting for stack creation..."
          aws cloudformation wait stack-create-complete \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Stack created successfully!"

      - name: Get EC2 instance IP
        id: get-ip
        run: |
          PUBLIC_IP=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`PublicIP`].OutputValue' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          echo "ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "✅ Instance IP: $PUBLIC_IP"

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Wait for EC2 to be ready
        run: |
          echo "⏳ Waiting for EC2 instance to be ready..."
          for i in {1..30}; do
            if ssh -i private_key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=5 ubuntu@${{ steps.get-ip.outputs.ip }} 'echo "Ready"' 2>/dev/null; then
              echo "✅ EC2 instance is ready!"
              exit 0
            fi
            echo "Attempt $i/30: Waiting..."
            sleep 10
          done
          echo "❌ EC2 instance not ready after 5 minutes"
          exit 1

      - name: Setup EC2 instance
        run: |
          echo "🔧 Setting up EC2 instance..."
          ssh -i private_key.pem -o StrictHostKeyChecking=no ubuntu@${{ steps.get-ip.outputs.ip }} '
            # Update system
            sudo apt-get update
            
            # Install Node.js 18
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            
            # Install PM2
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi
            
            # Create app directory
            sudo mkdir -p /var/www/perplexica
            sudo chown ubuntu:ubuntu /var/www/perplexica
            
            echo "✅ EC2 setup completed"
          '

      - name: Deploy application to EC2
        run: |
          echo "📦 Deploying application..."
          
          # Create deployment package
          tar -czf app.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.next/cache' \
            .
          
          # Copy to EC2
          scp -i private_key.pem -o StrictHostKeyChecking=no app.tar.gz ubuntu@${{ steps.get-ip.outputs.ip }}:/var/www/perplexica/
          
          # Extract and install on EC2
          ssh -i private_key.pem -o StrictHostKeyChecking=no ubuntu@${{ steps.get-ip.outputs.ip }} '
            cd /var/www/perplexica
            
            # Extract new version
            tar -xzf app.tar.gz
            rm app.tar.gz
            
            # Install dependencies
            npm ci --production
            
            # Build application (if needed)
            if [ ! -d ".next" ]; then
              npm run build
            fi
            
            # Setup PM2 ecosystem
            if [ -f "ecosystem.config.js" ]; then
              pm2 delete perplexica || true
              pm2 start ecosystem.config.js
              pm2 save
              sudo env PATH=$PATH:/usr/bin pm2 startup systemd -u ubuntu --hp /home/ubuntu
            else
              pm2 delete perplexica || true
              pm2 start npm --name perplexica -- start
              pm2 save
            fi
            
            echo "✅ Application deployed and started"
          '

      - name: Health check
        run: |
          echo "🏥 Running health check..."
          sleep 10
          
          ssh -i private_key.pem -o StrictHostKeyChecking=no ubuntu@${{ steps.get-ip.outputs.ip }} '
            pm2 status
            pm2 logs perplexica --lines 50 --nostream
          '

      - name: Cleanup
        if: always()
        run: rm -f private_key.pem

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Staging" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Instance IP:** \`${{ steps.get-ip.outputs.ip }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access" >> $GITHUB_STEP_SUMMARY
          echo "- **Application:** http://${{ steps.get-ip.outputs.ip }}:3000" >> $GITHUB_STEP_SUMMARY
          echo "- **SSH:** \`ssh -i private_key.pem ubuntu@${{ steps.get-ip.outputs.ip }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment completed successfully!" >> $GITHUB_STEP_SUMMARY

