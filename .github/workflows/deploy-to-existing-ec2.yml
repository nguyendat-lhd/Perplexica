name: Deploy to Existing EC2

on:
  push:
    branches: [ develop-deployment ]
  workflow_dispatch:

env:
  EC2_HOST: 13.228.19.21
  EC2_USER: ubuntu
  APP_DIR: /var/www/perplexica
  NODE_VERSION: '18'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint || echo "⚠️  Linting completed with warnings"
        continue-on-error: true

      - name: Run type checking
        run: npx tsc --noEmit || echo "⚠️  Type checking completed with warnings"
        continue-on-error: true

      - name: Run database migration
        run: npm run db:migrate

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          echo "🔍 Testing SSH connection to ${{ env.EC2_HOST }}..."
          ssh -i ~/.ssh/deploy_key.pem -o ConnectTimeout=10 ${{ env.EC2_USER }}@${{ env.EC2_HOST }} 'echo "✅ SSH connection successful"'

      - name: Create deployment package
        run: |
          echo "📦 Creating deployment package..."
          tar -czf deploy.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.next/cache' \
            --exclude='.aws-credentials' \
            --exclude='deploy.tar.gz' \
            --warning=no-file-changed \
            .
          ls -lh deploy.tar.gz

      - name: Copy package to EC2
        run: |
          echo "📤 Copying package to EC2..."
          scp -i ~/.ssh/deploy_key.pem deploy.tar.gz ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:/tmp/
          echo "✅ Package copied"

      - name: Deploy on EC2
        run: |
          echo "🚀 Deploying on EC2..."
          ssh -i ~/.ssh/deploy_key.pem ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'ENDSSH'
            set -e
            
            # Colors
            GREEN='\033[0;32m'
            BLUE='\033[0;34m'
            NC='\033[0m'
            
            echo -e "${BLUE}📁 Preparing deployment directory...${NC}"
            
            # Create app directory if not exists
            sudo mkdir -p ${{ env.APP_DIR }}
            sudo chown -R ${{ env.EC2_USER }}:${{ env.EC2_USER }} ${{ env.APP_DIR }}
            
            # Backup current deployment (if exists)
            if [ -d "${{ env.APP_DIR }}/backup" ]; then
              sudo rm -rf ${{ env.APP_DIR }}/backup
            fi
            
            if [ -d "${{ env.APP_DIR }}/.next" ]; then
              echo -e "${BLUE}💾 Backing up current deployment...${NC}"
              mkdir -p ${{ env.APP_DIR }}/backup
              cp -r ${{ env.APP_DIR }}/.next ${{ env.APP_DIR }}/backup/ 2>/dev/null || true
              cp ${{ env.APP_DIR }}/package.json ${{ env.APP_DIR }}/backup/ 2>/dev/null || true
            fi
            
            # Extract new version
            echo -e "${BLUE}📦 Extracting new version...${NC}"
            cd ${{ env.APP_DIR }}
            tar -xzf /tmp/deploy.tar.gz
            rm /tmp/deploy.tar.gz
            
            # Install Node.js if not exists
            if ! command -v node &> /dev/null; then
              echo -e "${BLUE}📥 Installing Node.js...${NC}"
              curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            
            # Install PM2 if not exists
            if ! command -v pm2 &> /dev/null; then
              echo -e "${BLUE}📥 Installing PM2...${NC}"
              sudo npm install -g pm2
            fi
            
            # Install dependencies
            echo -e "${BLUE}📦 Installing dependencies...${NC}"
            npm ci --production
            
            # Create log directory
            sudo mkdir -p /var/log/perplexica
            sudo chown -R ${{ env.EC2_USER }}:${{ env.EC2_USER }} /var/log/perplexica
            
            # Stop existing PM2 process
            echo -e "${BLUE}🛑 Stopping existing process...${NC}"
            pm2 delete perplexica 2>/dev/null || echo "No existing process"
            
            # Start with PM2
            echo -e "${BLUE}🚀 Starting application...${NC}"
            if [ -f "ecosystem.config.js" ]; then
              pm2 start ecosystem.config.js
            else
              pm2 start npm --name perplexica -- start
            fi
            
            # Save PM2 process list
            pm2 save
            
            # Setup PM2 startup (if not already set)
            sudo env PATH=\$PATH:/usr/bin pm2 startup systemd -u ${{ env.EC2_USER }} --hp /home/${{ env.EC2_USER }} || true
            
            echo -e "${GREEN}✅ Deployment completed!${NC}"
            
            # Show status
            pm2 status
          ENDSSH

      - name: Health check
        run: |
          echo "🏥 Running health check..."
          sleep 10
          
          # Check if app is responding
          for i in {1..30}; do
            if curl -f -s http://${{ env.EC2_HOST }}:3000 > /dev/null 2>&1; then
              echo "✅ Health check passed! Application is running."
              exit 0
            fi
            echo "Attempt $i/30: Waiting for application..."
            sleep 2
          done
          
          echo "⚠️  Application may not be fully ready yet. Check PM2 logs on EC2."
          
          # Show PM2 logs
          ssh -i ~/.ssh/deploy_key.pem ${{ env.EC2_USER }}@${{ env.EC2_HOST }} 'pm2 logs perplexica --lines 50 --nostream'

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key.pem
          rm -f deploy.tar.gz

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** \`${{ env.EC2_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Access" >> $GITHUB_STEP_SUMMARY
          echo "- **Application:** http://${{ env.EC2_HOST }}:3000" >> $GITHUB_STEP_SUMMARY
          echo "- **SSH:** \`ssh -i key.pem ${{ env.EC2_USER }}@${{ env.EC2_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Status" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Check Application" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# SSH to server" >> $GITHUB_STEP_SUMMARY
          echo "ssh -i key.pem ${{ env.EC2_USER }}@${{ env.EC2_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Check PM2 status" >> $GITHUB_STEP_SUMMARY
          echo "pm2 status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# View logs" >> $GITHUB_STEP_SUMMARY
          echo "pm2 logs perplexica" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

